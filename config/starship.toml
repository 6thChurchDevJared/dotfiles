# ═══════════════════════════════════════════════════════════════
#  Starship — tuned to match the Ghostty "glass" theme.
#
#  Design note: no solid powerline blocks. Filled background
#  segments punch opaque rectangles through a transparent
#  terminal and fight the wallpaper. Colored *text* on an
#  untouched background keeps the glass intact.
# ═══════════════════════════════════════════════════════════════

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs$python$rust$golang$java$ruby$php\
$package\
$cmd_duration\
$jobs\
$line_break\
$character"""

right_format = "$time"

add_newline = true
command_timeout = 800

# ── Prompt character ───────────────────────────────────────────
[character]
success_symbol = "[❯](bold #5fd77f)"
error_symbol   = "[❯](bold #ff6b6b)"
vimcmd_symbol  = "[❮](bold #ffbd5f)"

# ── Directory ──────────────────────────────────────────────────
[directory]
style = "bold #87d7ff"
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"
read_only = "  "
read_only_style = "#ff6b6b"
format = "[$path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = "󰝚 "
"Pictures"  = " "
"Developer" = "󰲋 "

# ── Git ────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "#d787ff"
format = "[on ](#5a5a62)[$symbol$branch]($style) "

[git_status]
style = "#ffbd5f"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "?${count}"
stashed    = "\\$${count}"
modified   = "!${count}"
staged     = "+${count}"
renamed    = "»${count}"
deleted    = "✘${count}"

[git_state]
style = "#ff6b6b"
format = "[\\($state( $progress_current/$progress_total)\\)]($style) "

# ── Languages (only shown in relevant projects) ────────────────
[nodejs]
symbol = " "
style = "#5fd77f"
format = "[via ](#5a5a62)[$symbol($version )]($style)"

[python]
symbol = " "
style = "#ffbd5f"
format = "[via ](#5a5a62)[$symbol($version )(\\($virtualenv\\) )]($style)"

[rust]
symbol = " "
style = "#ff9494"
format = "[via ](#5a5a62)[$symbol($version )]($style)"

[golang]
symbol = " "
style = "#87ffe7"
format = "[via ](#5a5a62)[$symbol($version )]($style)"

[java]
symbol = " "
style = "#ff9494"
format = "[via ](#5a5a62)[$symbol($version )]($style)"

[ruby]
symbol = " "
style = "#ff6b6b"
format = "[via ](#5a5a62)[$symbol($version )]($style)"

[php]
symbol = " "
style = "#d787ff"
format = "[via ](#5a5a62)[$symbol($version )]($style)"

[package]
symbol = "󰏗 "
style = "#5a5a62"
format = "[$symbol$version]($style) "
disabled = false

# ── Feedback ───────────────────────────────────────────────────
[cmd_duration]
min_time = 2000
style = "#5a5a62"
format = "[took $duration]($style) "

[jobs]
symbol = " "
style = "#5fe3d7"
number_threshold = 1
format = "[$symbol$number]($style) "

[time]
disabled = false
style = "#3f3f47"
time_format = "%H:%M"
format = "[$time]($style)"

# ── Off by default ─────────────────────────────────────────────
[username]
disabled = true

[hostname]
ssh_only = true
style = "#ffbd5f"
format = "[$hostname]($style) "
